services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pintar-sd-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pintar-sd
      POSTGRES_USER: pintar-sd
      POSTGRES_PASSWORD: pintar-sd-123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pintar-sd -d pintar-sd"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
